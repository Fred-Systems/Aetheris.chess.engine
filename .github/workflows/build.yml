name: Build Aetheris

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
      - name: Configure and verify stable signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "${KEYSTORE_B64:-}" ]] || { echo "::error::Missing AETHERIS_KEYSTORE_BASE64; refusing to build a debug-signed APK."; exit 1; }
          [[ -n "${STORE_PASSWORD:-}" ]] || { echo "::error::Missing AETHERIS_KEYSTORE_PASSWORD."; exit 1; }
          [[ -n "${KEY_ALIAS:-}" ]] || { echo "::error::Missing AETHERIS_KEY_ALIAS."; exit 1; }
          [[ -n "${KEY_PASSWORD:-}" ]] || { echo "::error::Missing AETHERIS_KEY_PASSWORD."; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/aetheris-release.jks"
          test -s "$RUNNER_TEMP/aetheris-release.jks"
          echo "AETHERIS_KEYSTORE_PATH=$RUNNER_TEMP/aetheris-release.jks" >> "$GITHUB_ENV"
          echo "Stable signing keystore is present and decoded."

      - name: Build release APK
        env:
          AETHERIS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AETHERIS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AETHERIS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aetheris-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
