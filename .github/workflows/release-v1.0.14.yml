name: Release Aetheris v1.0.14

on:
  push:
    branches: [ main ]
    paths:
      - app/**
      - .github/workflows/release-v1.0.14.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aetheris-release-v1.0.14
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Build release APK
        run: gradle assembleRelease

      - name: Prepare APK and UCI engine package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets/extracted release-assets/uci
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" release-assets/Aetheris.apk
          unzip -q "$APK" 'lib/*/libaetheris_engine.so' -d release-assets/extracted
          for abi in arm64-v8a armeabi-v7a; do
            BIN="release-assets/extracted/lib/${abi}/libaetheris_engine.so"
            if [ -f "$BIN" ]; then
              mkdir -p "release-assets/uci/${abi}"
              cp "$BIN" "release-assets/uci/${abi}/aetheris_engine"
              chmod +x "release-assets/uci/${abi}/aetheris_engine"
            fi
          done
          cat > release-assets/README-UCI.txt <<'EOF'
          Aetheris UCI engine for Android.
          Choose the binary under uci/<abi>/ matching your device architecture.
          It communicates using the Universal Chess Interface (UCI) over stdin/stdout.
          EOF
          (cd release-assets && zip -qr Aetheris-UCI-Engine-Android.zip uci README-UCI.txt)
          rm -rf release-assets/extracted release-assets/uci release-assets/README-UCI.txt

      - name: Publish v1.0.14 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.14
          name: Aetheris v1.0.14
          target_commitish: ${{ github.sha }}
          body: |
            Aetheris v1.0.14

            - Loads the current bundled NNUE weights from app assets into internal storage and replaces stale legacy cache files.
            - Reports NNUE load failures explicitly in native logs and the app status.
            - Separates Pure NNUE, Dual Core, and Classical evaluation modes.
            - Maps personality settings into learned-score scaling and piece mobility; aggression rewards pressure near the enemy king.
            - Adds guarded null-move pruning alongside existing principal-variation search and transposition tables.
            - Adds tie-order variety for equal-priority search candidates to reduce repetitive engine-vs-engine games.
            - Adds configurable move/check sound feedback with mute and volume controls.
          files: release-assets/*
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
