name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'app/src/main/cpp/**'
      - 'app/src/main/assets/nnue/weights.bin'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate website JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          html = open("docs/index.html", encoding="utf-8").read()
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          if not scripts:
              raise SystemExit("No inline website script found")
          open("/tmp/aetheris-site.js", "w", encoding="utf-8").write("\n".join(scripts))
          PY
          node --check /tmp/aetheris-site.js
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
      - name: Compile the real Aetheris engine to WebAssembly
        run: |
          em++ \
            app/src/main/cpp/wasm_bindings.cpp \
            app/src/main/cpp/engine.cpp \
            app/src/main/cpp/search.cpp \
            app/src/main/cpp/evaluate.cpp \
            app/src/main/cpp/nnue.cpp \
            -std=c++17 -O3 \
            -s WASM=1 \
            -s MODULARIZE=1 \
            -s EXPORT_NAME=AetherisModule \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s ENVIRONMENT=web \
            -s EXPORTED_FUNCTIONS='["_aetheris_init","_aetheris_load_nnue","_aetheris_set_mode","_aetheris_set_personality","_aetheris_validate_nnue","_aetheris_best_move","_aetheris_eval","_aetheris_analyze","_malloc","_free"]' \
            -s EXPORTED_RUNTIME_METHODS='["ccall","FS","UTF8ToString","stringToUTF8","lengthBytesUTF8"]' \
            --preload-file app/src/main/assets/nnue/weights.bin@/weights.bin \
            -o docs/aetheris.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
