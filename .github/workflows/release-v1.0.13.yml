name: Release Aetheris v1.0.13

# Retired release workflow: manual reruns only; never republish an obsolete version.
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: aetheris-release-v1.0.13-${{ github.sha }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download verified APK from successful build
        uses: actions/download-artifact@v4
        with:
          name: aetheris-release-apk
          path: downloaded-apk
          run-id: 40618124725
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          APK="$(find downloaded-apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" release-assets/Aetheris.apk

          mkdir -p release-assets/uci apk-extract
          unzip -q "$APK" 'lib/*/libaetheris_engine.so' -d apk-extract
          for abi in arm64-v8a armeabi-v7a; do
            BIN="apk-extract/lib/${abi}/libaetheris_engine.so"
            if [ -f "$BIN" ]; then
              mkdir -p "release-assets/uci/${abi}"
              cp "$BIN" "release-assets/uci/${abi}/aetheris_engine"
              chmod +x "release-assets/uci/${abi}/aetheris_engine"
            fi
          done

          if [ -d release-assets/uci/arm64-v8a ]; then
            cat > release-assets/README-UCI.txt <<'EOF'
          Aetheris UCI engine package for Android
          The executable is provided per ABI under uci/<abi>/aetheris_engine.
          Use the binary matching the device architecture. The engine communicates
          using the Universal Chess Interface (UCI) over standard input/output.
          EOF
            (cd release-assets && zip -qr Aetheris-UCI-Engine-Android.zip uci README-UCI.txt)
          fi
          rm -rf release-assets/uci release-assets/README-UCI.txt

      - name: Point v1.0.13 tag at this tested source commit
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            try {
              await github.rest.git.updateRef({
                owner,
                repo,
                ref: 'tags/v1.0.13',
                sha: context.sha,
                force: true
              });
            } catch (error) {
              if (error.status !== 404 && error.status !== 422) throw error;
              await github.rest.git.createRef({
                owner,
                repo,
                ref: 'refs/tags/v1.0.13',
                sha: context.sha
              });
            }

      - name: Publish GitHub release and attach assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.13
          name: Aetheris v1.0.13
          target_commitish: ${{ github.sha }}
          body: |
            Aetheris v1.0.13

            - Engine-vs-engine matches switch to the live board after starting.
            - Default search depth increased to improve tactical calculation.
            - Transposition scores are cleared on configuration changes and reused safely across searches with the same settings.
            - Main-game searches apply their engine options atomically, avoiding cross-talk with engine-vs-engine matches.
            - Play from Here configures color, time control, search depth, and engine mode.
            - Optional pondering searches likely user moves and reuses cached replies when the played move matches.
            - Evaluation uses a bounded alpha-beta search instead of relying only on static material evaluation.
            - Experimental NNUE output is blended with classical evaluation to reduce the impact of uncalibrated weights.
            - Analysis uses continuous progressive-depth search, preserves best-so-far lines, and shows algebraic notation on a dark background.
            - SAN castling notation is formatted correctly.
          files: release-assets/*
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
