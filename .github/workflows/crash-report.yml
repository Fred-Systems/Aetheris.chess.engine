name: Build and publish Aetheris crash-report APK

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  crash-report:
    if: contains(github.event.head_commit.message, 'Build Aetheris crash-report version')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/gradle-build-action@v3
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
      - name: Build isolated crash-report APK
        run: gradle assembleRelease -PcrashReport=true
      - name: Sign and verify APK
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            find app/build/outputs/apk -maxdepth 4 -type f -print || true
            echo "::error::No diagnostic APK was built"
            exit 1
          fi
          if [ -z "${ANDROID_SIGNING_KEY_BASE64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "::error::Required Android signing secrets are missing"
            exit 1
          fi
          printf '%s' "$ANDROID_SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/aetheris-release.jks"
          SDK_BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$SDK_BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/aetheris-release.jks" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --out Aetheris-CrashReport-1.0.7.apk "$APK_PATH"
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose --print-certs Aetheris-CrashReport-1.0.7.apk
          rm -f "$RUNNER_TEMP/aetheris-release.jks"
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aetheris-CrashReport-1.0.7-SIGNED
          path: Aetheris-CrashReport-1.0.7.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish diagnostic prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.7-crashreport Aetheris-CrashReport-1.0.7.apk \
            --target "${GITHUB_SHA}" \
            --title "Aetheris 1.0.7 Crash Report Build" \
            --prerelease \
            --notes "Diagnostic-only Aetheris build. Installs alongside the normal app. Persists the last engine-search FEN/depth/time and search start/completion markers, adds native search progress to Android logcat (tag AetherisEngine), and offers Settings > Export crash report. Please reproduce the crash once, reopen the app, then export and send the report. This is not the regular release."
