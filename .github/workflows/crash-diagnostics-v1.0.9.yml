name: Build and publish Aetheris 1.0.9 crash diagnostics

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  crash-diagnostics:
    if: contains(github.event.head_commit.message, 'Build Aetheris crash-diagnostics version 1.0.9')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/gradle-build-action@v3
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install required NDK and CMake
        run: sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Build isolated diagnostic APK
        run: gradle assembleRelease -PcrashReport=true
      - name: Sign and verify diagnostic APK
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            find app/build/outputs/apk -maxdepth 4 -type f -print || true
            echo "::error::No diagnostic APK was built"
            exit 1
          fi
          if [ -z "${ANDROID_SIGNING_KEY_BASE64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "::error::Required Android signing secrets are missing"
            exit 1
          fi
          printf '%s' "$ANDROID_SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/aetheris-release.jks"
          SDK_BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$SDK_BUILD_TOOLS/zipalign" -f -p 4 "$APK_PATH" "$RUNNER_TEMP/aetheris-aligned.apk"
          "$SDK_BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/aetheris-release.jks" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --out Aetheris-CrashDiagnostics-1.0.9.apk "$RUNNER_TEMP/aetheris-aligned.apk"
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose --print-certs Aetheris-CrashDiagnostics-1.0.9.apk
          rm -f "$RUNNER_TEMP/aetheris-release.jks" "$RUNNER_TEMP/aetheris-aligned.apk"
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aetheris-CrashDiagnostics-1.0.9-SIGNED
          path: Aetheris-CrashDiagnostics-1.0.9.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish diagnostic prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.9-crashreport Aetheris-CrashDiagnostics-1.0.9.apk \
            --target "${GITHUB_SHA}" \
            --title "Aetheris 1.0.9 Crash Diagnostics" \
            --prerelease \
            --notes "Dedicated diagnostic build that installs alongside the regular Aetheris app. Persists Java uncaught-exception stack traces and breadcrumbs; installs a native fatal-signal handler that records SIGSEGV/SIGABRT/SIGBUS/SIGILL/SIGFPE plus the native engine stage before allowing Android to terminate normally. On relaunch, opens a full-screen crash report with saved details and an export button. Android's system tombstone may still be needed for a complete native backtrace. Reproduce the crash once in this diagnostic app, reopen it, and export the report."
