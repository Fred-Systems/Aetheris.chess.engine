name: Build and publish Aetheris v1.0.5

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, 'Set Aetheris version 1.0.5') || contains(github.event.head_commit.message, 'Fix v1.0.5 release build')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/gradle-build-action@v3
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
      - name: Build release APK
        run: gradle assembleRelease
      - name: Locate and sign release APK
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "No release APK was produced. Release output contents:"
            find app/build/outputs/apk -maxdepth 4 -type f -print || true
            exit 1
          fi
          if [ -z "${ANDROID_SIGNING_KEY_BASE64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "::error::Missing signing secrets. Configure ANDROID_SIGNING_KEY_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD."
            exit 1
          fi
          printf '%s' "$ANDROID_SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/aetheris-release.jks"
          SDK_BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$SDK_BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/aetheris-release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out Aetheris-1.0.5.apk "$APK_PATH"
          "$SDK_BUILD_TOOLS/apksigner" verify Aetheris-1.0.5.apk
          rm -f "$RUNNER_TEMP/aetheris-release.jks"
      - name: Publish GitHub release and attach APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.5 Aetheris-1.0.5.apk \
            --target "${GITHUB_SHA}" \
            --title "Aetheris v1.0.5" \
            --notes "Aetheris v1.0.5 hardens native engine move generation and NNUE loading, substantially enlarges the chessboard, and applies player-color changes immediately. Android versionCode is incremented for upgrade handling."
