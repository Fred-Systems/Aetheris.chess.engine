name: Release Aetheris v1.0.15

on:
  push:
    branches: [ main ]
    paths:
      - app/**
      - .github/workflows/release-v1.0.15.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aetheris-release-v1.0.15
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Configure stable signing key when provided
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.AETHERIS_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/aetheris-release.jks"
            echo "AETHERIS_KEYSTORE_PATH=$RUNNER_TEMP/aetheris-release.jks" >> "$GITHUB_ENV"
            echo "Stable Aetheris signing key configured."
          else
            echo "::warning::AETHERIS_KEYSTORE_BASE64 is not configured. The APK will use this runner's temporary debug key and will not support in-place updates."
          fi

      - name: Build release APK
        env:
          AETHERIS_KEYSTORE_PASSWORD: ${{ secrets.AETHERIS_KEYSTORE_PASSWORD }}
          AETHERIS_KEY_ALIAS: ${{ secrets.AETHERIS_KEY_ALIAS }}
          AETHERIS_KEY_PASSWORD: ${{ secrets.AETHERIS_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Prepare APK and UCI engine package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets/extracted release-assets/uci
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" release-assets/Aetheris.apk
          unzip -q "$APK" 'lib/*/libaetheris_engine.so' -d release-assets/extracted
          for abi in arm64-v8a armeabi-v7a; do
            BIN="release-assets/extracted/lib/${abi}/libaetheris_engine.so"
            if [ -f "$BIN" ]; then
              mkdir -p "release-assets/uci/${abi}"
              cp "$BIN" "release-assets/uci/${abi}/aetheris_engine"
              chmod +x "release-assets/uci/${abi}/aetheris_engine"
            fi
          done
          cat > release-assets/README-UCI.txt <<'EOF'
          Aetheris UCI engine for Android.
          Select uci/<abi>/aetheris_engine matching the device ABI.
          The APK is the recommended way to install the app.
          EOF
          (cd release-assets && zip -qr Aetheris-UCI-Engine-Android.zip uci README-UCI.txt)
          rm -rf release-assets/extracted release-assets/uci release-assets/README-UCI.txt

      - name: Upload build artifacts even if release publication fails
        uses: actions/upload-artifact@v4
        with:
          name: aetheris-v1.0.15-release
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish v1.0.15 release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: v1.0.15
          name: Aetheris v1.0.15
          target_commitish: ${{ github.sha }}
          body: |
            Aetheris v1.0.15

            Engine:
            - Improved move ordering with killer/history heuristics and late-move reductions.
            - Tightened null-move pruning to require a static fail-high and avoid low-material zugzwang cases.
            - Anchored the experimental bundled NNUE output to classical evaluation and bounded its contribution to prevent extreme miscalibration from dominating moves.
            - Classical evaluation remains the fallback when NNUE fails to load.

            Gameplay:
            - Added blindfold board mode.
            - Added queued single/alternative premoves and a conditional-reply editor.
            - Added random Chess960 starting positions and PGN variant/start-position tags. Chess960 castling by the native engine remains unsupported, so engine-vs-user Chess960 is explicitly experimental.

            Compatibility:
            - Version code is increased to 16.
            - To support seamless updates, configure AETHERIS_KEYSTORE_BASE64, AETHERIS_KEYSTORE_PASSWORD, AETHERIS_KEY_ALIAS, and AETHERIS_KEY_PASSWORD repository secrets with a stable private signing key. Without these secrets, CI uses a temporary debug key; an APK signed that way cannot reliably update an older install.
          files: release-assets/*
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
